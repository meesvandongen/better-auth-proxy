worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  65;

  # Upstreams
  upstream auth_proxy {
    server auth-proxy:8080;
  }
  upstream demo_app {
    server demo-app:3000;
  }

  server {
    listen 80;
    server_name _;

    # Expose auth-proxy under /oauth2/
    location /oauth2/ {
      proxy_pass       http://auth_proxy;
      proxy_set_header Host                       $host;
      proxy_set_header X-Real-IP                  $remote_addr;
      proxy_set_header X-Auth-Request-Redirect    $request_uri;
    }

    # Subrequest endpoint for auth_request
    location = /oauth2/auth {
      proxy_pass                        http://auth_proxy;
      proxy_set_header Host             $host;
      proxy_set_header X-Real-IP        $remote_addr;
      proxy_set_header X-Forwarded-Uri  $request_uri;
      proxy_set_header Content-Length   "";
      proxy_pass_request_body           off;
    }

    # Protect your app
    location / {
      auth_request /oauth2/auth;

      # Redirect unauthenticated users to sign-in
      error_page 401 =403 /oauth2/sign_in;

      # Forward identity to your app (mirrors oauth2-proxy --set-xauthrequest)
      auth_request_set $user   $upstream_http_x_auth_request_user;
      auth_request_set $email  $upstream_http_x_auth_request_email;
      auth_request_set $uid    $upstream_http_x_auth_request_uid;
      auth_request_set $token  $upstream_http_x_auth_request_access_token;

      proxy_set_header  X-User          $user;
      proxy_set_header  X-Email         $email;
      proxy_set_header  X-UID           $uid;
      proxy_set_header  X-Access-Token  $token;

      # Propagate refreshed cookies from the subrequest
      auth_request_set $auth_cookie $upstream_http_set_cookie;
      add_header Set-Cookie $auth_cookie;

      proxy_pass http://demo_app;
    }
  }
}
